name: Update Publications

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Also allows a manual "Run workflow" button in the Actions tab

permissions:
  contents: write          # Needed to commit publications.json back to the repo

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch publications from Google Scholar
        env:
          SCHOLAR_AUTHOR_ID: ${{ vars.SCHOLAR_AUTHOR_ID }}
        run: python scripts/fetch_publications.py

      - name: Commit updated publications.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git diff --staged --quiet \
            && echo "No changes to publications." \
            || git commit -m "chore: update publications [skip ci]"
          git push
